<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create an Account</title>
        <link rel="stylesheet" href="./styles/styles.css">
    </head>
    <body>
        <div class="title">
            <h1>My Website</h1>
        </div>
        <div class="container">
            <form>
                <label id="username" class="username">Username: </label>
                <input class="input-group" type="text" placeholder="Enter your username..." maxlength="100" minlength="3" required><br><br>
                <label>Full Name: </label>
                <input class="input-group" type="text" placeholder="Enter your name..." maxlength="100" minlength="3" required><br><br>
                <label>Age: </label>
                <input type="number" placeholder="Enter your age..." max="100" min="10" required><br><br>
                <label>Password: </label>
                <input class="input-group" type="password" placeholder="Enter your password..." maxlength="100" minlength="3" required><br><br>
                <label>Confirm Password: </label>
                <input class="input-group" type="password" placeholder="Enter your password again..." maxlength="100" minlength="3" required><br><br>
                <label>Gender: </label>
                <input type="radio" name="gender">Male <input type="radio" name="gender">Female<br><br>
                <input type="checkbox"> <label>Show Password</label><br><br>
                <label>Role: </label>
                <select>
                    <option disabled selected>Please choose a role</option>
                    <option>Role1</option>
                    <option>Role2</option>
                    <option>Role3</option>
                </select><br><br>
                <a id="login" target="_blank" href="login.html">Already have an account? Login here</a><br><br>
                <div class="submit">
                    <button id="submit" type="button">Register</button>
                </div>
            </form>
        </div>
        <script src="./scripts/index.js"></script>
    </body>
</html>
